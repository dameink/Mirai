name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements.lock
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  backend-postgres:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements.lock
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MIRAI_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mirai_test
      - run: python tests/load_smoke.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MIRAI_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mirai_test
  mobile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform ios --platform android --output-dir /tmp/mirai-bundles
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://example.invalid
